<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Task">
<meta name="description" content="毎日を、ひとつずつ。自分専用のタスク管理。">
<title>My Task</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<script src="./tasks.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<main>
<header><span class="brand" aria-hidden="true">✓</span><p class="eyebrow">毎日を、ひとつずつ。</p><h1>My Task</h1><p class="subtitle">やることを整理して、心に余白を。</p></header>
<section class="summary" aria-label="タスクの状況"><div><strong id="remaining">0</strong><span>件のタスクが待っています</span></div><p id="progress">今日も自分のペースで。</p><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></section>
<form id="task-form"><label for="task-input">新しいタスク</label><div class="input-row"><input id="task-input" name="task" type="text" maxlength="200" placeholder="やることを入力" required autocomplete="off"><button type="submit">＋ 追加</button></div><p class="hint">200文字まで入力できます</p></form>
<p id="message" role="status" aria-live="polite"></p>
<section aria-labelledby="list-heading"><div class="list-heading"><h2 id="list-heading">タスク一覧</h2><span id="total">0件</span></div><ul id="task-list"></ul><div id="empty"><span aria-hidden="true">✓</span><h3>すっきり、何もありません</h3><p>最初のタスクを追加してみましょう。</p></div></section>
<footer><p id="offline-status" role="status">オフライン機能を準備しています</p><p>タスクはこの端末に自動保存されます</p><details><summary>iPhoneでアプリとして使う</summary><p>Safariの共有メニューから「ホーム画面に追加」を選びます。初回はオンラインで開き、「オフラインでも使えます」の表示を確認してください。</p></details></footer>
<noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
</main>
</body>
</html>
